[project]
name = "pmp-backend"
version = "0.1.0"
description = "REST API of the VIVES Project Management Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmp_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
