name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Lint
        run: uvx ruff@0.16.9 check .
      - name: Check formatting
        run: uvx ruff@0.16.9 format --check .

  test:
    runs-on: ubuntu-latest
    # Tests run against a real PostgreSQL (docs/coding-standards.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmp
          POSTGRES_PASSWORD: pmp
          POSTGRES_DB: pmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmp -d pmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pmp:pmp@localhost:5432/pmp_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --locked
          uv run pytest
      - name: Frontend tests
        working-directory: frontend
        run: |
          uv sync --locked
          uv run pytest
