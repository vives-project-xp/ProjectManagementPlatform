[project]
name = "pmp-frontend"
version = "0.1.0"
description = "NiceGUI frontend of the VIVES Project Management Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "nicegui>=2.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    # Frontend tests talk to the real backend in the same process (seam 2 in spec #3).
    "pmp-backend",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
pmp-backend = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmp_frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
main_file = "src/pmp_frontend/main.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["dev_login: run the backend with the test login turned on"]
