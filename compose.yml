# Production stack (ADR 0001). Values come from .env (see .env.example);
# on the VM: docker compose -p pmp --env-file /opt/pmp/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      LOGINS_FILE: /run/secrets/logins.txt
      PHOTOS_DIR: /data/photos
      CHAT_FILES_DIR: /data/chat-files
      SOCIAL_MEDIA_DIR: /data/social-media
      # Test login without a password (api/dev_login.py); set DEV_LOGIN=true in
      # .env only while the team is testing.
      DEV_LOGIN: ${DEV_LOGIN:-false}
      # Project repositories (spec #49): the organisation and a fine-grained
      # token for it. Without a token, the GitHub actions are off.
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Trello boards (spec #61): the API key and token of the dedicated Trello
      # account. Without them, the Trello actions are off.
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      # The school's LLM for Post suggestions (spec #110). Without a key, no
      # suggestions are made.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.llm.mechatronics.be/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-27b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Automatic publishing on Instagram (#117, ADR 0010): the team's first
      # long-lived token (later ones live in the database) and, once the VM is
      # reachable from the internet, its public address for photo posts.
      # Without a token every post goes through To post today.
      INSTAGRAM_TOKEN: ${INSTAGRAM_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-me}
      # Unified login (apps since 2026): https://graph.facebook.com/v23.0 and
      # an empty INSTAGRAM_REFRESH_URL, because that token never expires.
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com/v23.0}
      INSTAGRAM_REFRESH_URL: ${INSTAGRAM_REFRESH_URL-https://graph.instagram.com/refresh_access_token}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL:-}
      # TikTok as a Channel (spec #145): the developer app's key and secret and
      # the Login Kit redirect URI. The account's tokens live in the database
      # (Connect TikTok on the Social media screen). Without a key, TikTok is off.
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-https://github.com/vives-project-xp/ProjectManagementPlatform}
      # VIVES login through Authentik (spec #160, ADR 0011): the application's
      # Issuer URL, Client ID and secret; empty means VIVES login is off (or set
      # on the Superuser's VIVES login screen).
      AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      # TikTok's URL-prefix verification file for PUBLIC_MEDIA_URL/social/ (#150).
      TIKTOK_VERIFICATION_FILE: ${TIKTOK_VERIFICATION_FILE:-}
      TIKTOK_VERIFICATION_CONTENT: ${TIKTOK_VERIFICATION_CONTENT:-}
      # The 08:30 daily email (spec #68): the mailbox it is sent from. Without
      # SMTP_HOST no email is sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-VIVES Project Experience <noreply@pmp.local>}
      SITE_URL: ${SITE_URL:-https://10.20.10.33}
    volumes:
      # Project photos, one file per Project (outside the database).
      - photos:/data/photos
      # Photos and files attached to Chat messages, one folder per Project.
      - chat-files:/data/chat-files
      # Photos and videos of Weekly updates (spec #110), one folder per Project.
      - social-media:/data/social-media
      # Starting accounts; the file stays outside the repository on the VM. If it
      # is missing, the backend logs a warning and starts without them.
      - ${LOGINS_PATH:-./logins.txt}:/run/secrets/logins.txt:ro
    depends_on:
      db:
        condition: service_healthy

  # Nightly pg_dump kept for 14 days (ADR 0005, docs/backups.md).
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # On the VM, outside the runner's checkout (which is wiped on every deploy).
      - ${BACKUP_PATH:-/opt/pmp/backups}:/backups
      - photos:/photos:ro
      - chat-files:/chat-files:ro
      - social-media:/social-media:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      STORAGE_SECRET: ${STORAGE_SECRET}
      # Caddy serves only HTTPS, so the session cookie gets the Secure flag.
      SECURE_COOKIES: "true"
      # The footer (#79): unset or empty keeps the built-in VIVES value, "none"
      # hides that part (frontend settings.py).
      FOOTER_INSTAGRAM: ${FOOTER_INSTAGRAM:-}
      FOOTER_TIKTOK: ${FOOTER_TIKTOK:-}
      FOOTER_YOUTUBE: ${FOOTER_YOUTUBE:-}
      FOOTER_LINKEDIN: ${FOOTER_LINKEDIN:-}
      FOOTER_PRIVACY_URL: ${FOOTER_PRIVACY_URL:-}
      FOOTER_ADDRESS: ${FOOTER_ADDRESS:-}
    volumes:
      # NiceGUI's per-browser storage (holds the API token); kept on a volume so
      # a redeploy, which recreates the container, does not log everyone out.
      - frontend-storage:/app/.nicegui
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  db-data:
  frontend-storage:
  photos:
  chat-files:
  social-media:
  caddy-data:
  caddy-config:
