# Production stack (ADR 0001). Values come from .env (see .env.example);
# on the VM: docker compose -p pmp --env-file /opt/pmp/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      LOGINS_FILE: /run/secrets/logins.txt
      PHOTOS_DIR: /data/photos
      # Test login without a password (api/dev_login.py); set DEV_LOGIN=true in
      # .env only while the team is testing.
      DEV_LOGIN: ${DEV_LOGIN:-false}
      # Project repositories (spec #49): the organisation and a fine-grained
      # token for it. Without a token, the GitHub actions are off.
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Trello boards (spec #61): the API key and token of the dedicated Trello
      # account. Without them, the Trello actions are off.
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      # The 08:30 daily email (spec #68): the mailbox it is sent from. Without
      # SMTP_HOST no email is sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-VIVES Project Experience <noreply@pmp.local>}
      SITE_URL: ${SITE_URL:-https://10.20.10.33}
    volumes:
      # Project photos, one file per Project (outside the database).
      - photos:/data/photos
      # Starting accounts; the file stays outside the repository on the VM. If it
      # is missing, the backend logs a warning and starts without them.
      - ${LOGINS_PATH:-./logins.txt}:/run/secrets/logins.txt:ro
    depends_on:
      db:
        condition: service_healthy

  # Nightly pg_dump kept for 14 days (ADR 0005, docs/backups.md).
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # On the VM, outside the runner's checkout (which is wiped on every deploy).
      - ${BACKUP_PATH:-/opt/pmp/backups}:/backups
      - photos:/photos:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      STORAGE_SECRET: ${STORAGE_SECRET}
      # Caddy serves only HTTPS, so the session cookie gets the Secure flag.
      SECURE_COOKIES: "true"
      # The footer (#79): unset or empty keeps the built-in VIVES value, "none"
      # hides that part (frontend settings.py).
      FOOTER_INSTAGRAM: ${FOOTER_INSTAGRAM:-}
      FOOTER_TIKTOK: ${FOOTER_TIKTOK:-}
      FOOTER_YOUTUBE: ${FOOTER_YOUTUBE:-}
      FOOTER_LINKEDIN: ${FOOTER_LINKEDIN:-}
      FOOTER_PRIVACY_URL: ${FOOTER_PRIVACY_URL:-}
      FOOTER_ADDRESS: ${FOOTER_ADDRESS:-}
    volumes:
      # NiceGUI's per-browser storage (holds the API token); kept on a volume so
      # a redeploy, which recreates the container, does not log everyone out.
      - frontend-storage:/app/.nicegui
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  db-data:
  frontend-storage:
  photos:
  caddy-data:
  caddy-config:
