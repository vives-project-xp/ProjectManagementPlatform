# PostgreSQL for running the test suites locally:
#   docker compose -f compose.test.yml up -d
name: pmp-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pmp
      POSTGRES_PASSWORD: pmp
      POSTGRES_DB: pmp_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmp -d pmp_test"]
      interval: 2s
      timeout: 5s
      retries: 15
